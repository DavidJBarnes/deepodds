<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- Mask: white = visible, black = hidden. Carve the pulse out of the D. -->
    <mask id="pulse-cut">
      <rect width="48" height="48" fill="white"/>
      <polyline
        points="7,24 17.5,24 20.5,15 24.5,33 28.5,19 31.5,28 34.5,24 42,24"
        fill="none"
        stroke="black"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
  </defs>
  <!-- Dark rounded-square background -->
  <rect width="48" height="48" rx="11" fill="#0f172a"/>
  <rect x=".5" y=".5" width="47" height="47" rx="10.5" fill="none" stroke="#1e293b" stroke-width=".75"/>
  <!-- Solid D with pulse carved out via mask -->
  <path
    d="M15,9 L15,39 L27,39 C34.7,39 41,32.7 41,25 L41,23 C41,15.3 34.7,9 27,9 Z M19.5,13.5 L27,13.5 C32.2,13.5 36.5,17.8 36.5,23 L36.5,25 C36.5,30.2 32.2,34.5 27,34.5 L19.5,34.5 Z"
    fill="url(#g)"
    mask="url(#pulse-cut)"
  />
  <!-- Pulse line outside the D (extends left and right of the letterform) -->
  <polyline
    points="7,24 17.5,24 20.5,15 24.5,33 28.5,19 31.5,28 34.5,24 42,24"
    fill="none"
    stroke="url(#g)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
