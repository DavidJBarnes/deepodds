# DeepOdds host-level nginx gateway
# Terminates TLS, proxies /api to backend and /* to frontend.
# Deploy to: /etc/nginx/sites-available/deepodds → symlink to /etc/nginx/sites-enabled/
# Enable auto-start: sudo systemctl enable nginx

# HTTP → HTTPS redirect + Let's Encrypt challenge
server {
    listen 80;
    listen [::]:80;
    server_name deepodds.davidjbarnes.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS gateway
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deepodds.davidjbarnes.com;

    ssl_certificate     /etc/letsencrypt/live/deepodds.davidjbarnes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepodds.davidjbarnes.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # API → backend (FastAPI on 127.0.0.1:8003)
    location /api {
        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else → frontend (nginx serving static SPA on 127.0.0.1:8084)
    location / {
        proxy_pass         http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
