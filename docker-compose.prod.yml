services:
  api:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-api
    command: uvicorn app.main:app --host 127.0.0.1 --port 8003 --proxy-headers --forwarded-allow-ips=*
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      # Read-only access to the carry harness state for GET /api/v1/carry/status.
      - CARRY_STATE=/data/state.json
      - CARRY_HISTORY=/data/history.jsonl
      - CARRY_HEARTBEAT=/data/heartbeat.json
    volumes:
      - /opt/deepodds/carry:/data:ro

  # Funding-carry paper harness (Hyperliquid perp + Coinbase spot). Independent
  # of the Kalshi api/scanner. State persists in a host bind-mount (NOT a named
  # volume) so the deploy's `docker system prune --volumes` never wipes it.
  carry:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-carry
    command: python -m carry.loop --interval 600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - CARRY_STATE=/data/state.json
      - CARRY_HISTORY=/data/history.jsonl
      - CARRY_HEARTBEAT=/data/heartbeat.json
    volumes:
      - /opt/deepodds/carry:/data:z   # :z relabels for SELinux hosts; no-op elsewhere

  frontend:
    image: "NGINX_IMAGE_PLACEHOLDER"
    container_name: deepodds-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
