services:
  api:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-api
    command: uvicorn app.main:app --host 127.0.0.1 --port 8003 --proxy-headers --forwarded-allow-ips=*
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      # Read-only access to the longshot harness state for GET /api/v1/longshot/status.
      - LONGSHOT_STATE=/longshot-data/state.json
      - LONGSHOT_HISTORY=/longshot-data/history.jsonl
      - LONGSHOT_HEARTBEAT=/longshot-data/heartbeat.json
      # Read-only access to the LIVE harness state for GET /api/v1/longshot/live/status.
      - LONGSHOT_LIVE_STATE=/longshot-live-data/state.json
      - LONGSHOT_LIVE_HISTORY=/longshot-live-data/history.jsonl
      - LONGSHOT_LIVE_HEARTBEAT=/longshot-live-data/heartbeat.json
    volumes:
      - /opt/deepodds/longshot:/longshot-data:ro
      - /opt/deepodds/longshot-live:/longshot-live-data:ro

  # Longshot-short paper harness (sell overpriced 1-12c Kalshi longshots near
  # settlement, vs the live order book). Self-contained: state persists in a
  # host bind-mount so the deploy's prune --volumes never wipes it.
  longshot:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_MAX_OPEN=120         # match live so the paper control is apples-to-apples
    volumes:
      - /opt/deepodds/longshot:/data:z

  # Longshot-short paper harness WITH an OI selection filter ON — A/B treatment arm
  # vs the unfiltered `longshot` control above (both paper, no money). Same signal
  # otherwise. FLIPPED 2026-07-04 from LOW-OI to HIGH-OI (OI_KEEP_HIGH=true): the
  # #209 low-OI backtest was biased (cheap-selected shards, ~0% temp YES, can't test
  # loss-avoidance — see VERDICT_BACKTEST_BIAS.md); live-forward data (real losses)
  # shows HIGH-OI is the safer/better bucket (YES 1.3% vs 4.7%, +3.2c vs -1.0c).
  # This arm now forward-tests that where it can actually be measured. Read the A/B
  # by comparing this container's settled c/ct vs the control. Promote to live only
  # after this arm beats the control over ~1-2 weeks of real-loss settlements.
  longshot-paper-oi:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot-paper-oi
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_MAX_OPEN=120          # match control + live so it's apples-to-apples
      - LONGSHOT_OI_FILTER=true        # the treatment: OI selection ON
      - LONGSHOT_OI_MAX=968            # partition threshold (same cut as the analysis)
      - LONGSHOT_OI_KEEP_HIGH=true     # trade only HIGH-OI (>968) — the safer bucket in live data
    volumes:
      - /opt/deepodds/longshot-paper-oi:/data:z

  # Longshot-short LIVE harness (real Kalshi orders). Same signal as the paper
  # container above, which keeps running untouched as the control. Ships SAFE:
  # LONGSHOT_DRY_RUN=true => it reconciles + reads Kalshi truth + logs INTENDED
  # orders but places NOTHING (Phase 1/2). To arm (Phase 3): fund the account,
  # load a trading-scoped key into .env, set LONGSHOT_DRY_RUN=false, ensure no
  # /opt/deepodds/longshot-live/KILL file. Emergency stop at any time:
  # `touch /opt/deepodds/longshot-live/KILL`.
  longshot-live:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot-live
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_MODE=live
      - LONGSHOT_DRY_RUN=false         # ARMED (canary, 2026-06-24) — real 1-ct orders; kill: touch /opt/deepodds/longshot-live/KILL
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_KILL_FILE=/data/KILL
      # Canary caps ($100-250 phase): 1 contract/trade, $200 max deployed, $25 daily-loss kill.
      # MAX_OPEN raised 40->120 (2026-06-26): book was pinned at 40 with only $38 of the
      # $200 collateral deployed — more breadth (not bigger bets) to reach the Phase-4 gate
      # faster. Size stays 1 ct; $200 deployed + $25 daily kill remain the real governors.
      - LONGSHOT_ACCOUNT=250
      - LONGSHOT_MAX_DEPLOYED=200
      - LONGSHOT_MAX_PER_TRADE=1
      - LONGSHOT_MAX_OPEN=120
      - LONGSHOT_MAX_DAILY_LOSS=25
    volumes:
      - /opt/deepodds/longshot-live:/data:z

  frontend:
    image: "NGINX_IMAGE_PLACEHOLDER"
    container_name: deepodds-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
