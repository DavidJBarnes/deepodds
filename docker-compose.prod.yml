services:
  api:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-api
    command: uvicorn app.main:app --host 127.0.0.1 --port 8003 --proxy-headers --forwarded-allow-ips=*
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      # Read-only access to the longshot harness state for GET /api/v1/longshot/status.
      - LONGSHOT_STATE=/longshot-data/state.json
      - LONGSHOT_HISTORY=/longshot-data/history.jsonl
      - LONGSHOT_HEARTBEAT=/longshot-data/heartbeat.json
      # Read-only access to the LIVE harness state for GET /api/v1/longshot/live/status.
      - LONGSHOT_LIVE_STATE=/longshot-live-data/state.json
      - LONGSHOT_LIVE_HISTORY=/longshot-live-data/history.jsonl
      - LONGSHOT_LIVE_HEARTBEAT=/longshot-live-data/heartbeat.json
    volumes:
      - /opt/deepodds/longshot:/longshot-data:ro
      - /opt/deepodds/longshot-live:/longshot-live-data:ro

  # Longshot-short paper harness (sell overpriced 1-12c Kalshi longshots near
  # settlement, vs the live order book). Self-contained: state persists in a
  # host bind-mount so the deploy's prune --volumes never wipes it.
  longshot:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_MAX_OPEN=120         # match live so the paper control is apples-to-apples
    volumes:
      - /opt/deepodds/longshot:/data:z

  # Longshot-short paper harness WITH an OI selection filter ON — A/B treatment arm
  # vs the unfiltered `longshot` control above (both paper, no money). Same signal
  # otherwise. FLIPPED 2026-07-04 from LOW-OI to HIGH-OI (OI_KEEP_HIGH=true): the
  # #209 low-OI backtest was biased (cheap-selected shards, ~0% temp YES, can't test
  # loss-avoidance — see VERDICT_BACKTEST_BIAS.md); live-forward data (real losses)
  # shows HIGH-OI is the safer/better bucket (YES 1.3% vs 4.7%, +3.2c vs -1.0c).
  # This arm now forward-tests that where it can actually be measured. Read the A/B
  # by comparing this container's settled c/ct vs the control. Promote to live only
  # after this arm beats the control over ~1-2 weeks of real-loss settlements.
  longshot-paper-oi:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot-paper-oi
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_MAX_OPEN=120          # match control + live so it's apples-to-apples
      - LONGSHOT_OI_FILTER=true        # the treatment: OI selection ON
      - LONGSHOT_OI_MAX=968            # partition threshold (same cut as the analysis)
      - LONGSHOT_OI_KEEP_HIGH=true     # trade only HIGH-OI (>968) — the safer bucket in live data
    volumes:
      - /opt/deepodds/longshot-paper-oi:/data:z

  # Longshot-short SPORTS-TAILS paper arm (GO-B, 2026-07-08). Sells 1-12c tails of
  # in-season sports GAME markets — where the Kalshi fee curve is ~0 (fee peaks at
  # 50c, near-zero at the tails) and sports is our fattest backtest category. Pure
  # paper, own state dir, whitelist overridden to in-season game series. Caveat under
  # forward test: sports tails resolve on discrete game events; in-game price paths
  # may hand adverse fills (entry-timing from temp/crypto may not transfer).
  longshot-paper-sports:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot-paper-sports
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_MAX_OPEN=120
      - LONGSHOT_WHITELIST=KXMLBGAME,KXWNBAGAME,KXATPMATCH,KXWTAMATCH
    volumes:
      - /opt/deepodds/longshot-paper-sports:/data:z

  # Crypto-tails paper arm (GO-A, 2026-07-08) — the most promising new vein. Sells
  # 1-12c upper tails of Kalshi daily BTC/ETH markets, but ONLY when Kalshi overprices
  # them vs Deribit's risk-neutral fair (oracle gate) — "rent the sharper venue's
  # price". Correlation-capped per underlying (all BTC tails are one trade). Pure
  # paper. Snapshot edge was +1.18c/ct vs Deribit; this forward-validates it through
  # settlement alongside the oracle daemon's dataset.
  longshot-paper-crypto:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot-paper-crypto
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_MAX_OPEN=120
      - LONGSHOT_WHITELIST=KXBTCD,KXETHD
      - LONGSHOT_ORACLE_GATE=true          # sell only tails Kalshi overprices vs Deribit
      - LONGSHOT_ORACLE_MIN_EDGE=0.005      # require >= 0.5c Kalshi-over-Deribit gap
      - LONGSHOT_MAX_UNDERLYING=400         # cap open collateral per underlying (~5% of sim $8k)
    volumes:
      - /opt/deepodds/longshot-paper-crypto:/data:z

  # Longshot-short LIVE harness (real Kalshi orders). Same signal as the paper
  # container above, which keeps running untouched as the control. Ships SAFE:
  # LONGSHOT_DRY_RUN=true => it reconciles + reads Kalshi truth + logs INTENDED
  # orders but places NOTHING (Phase 1/2). To arm (Phase 3): fund the account,
  # load a trading-scoped key into .env, set LONGSHOT_DRY_RUN=false, ensure no
  # /opt/deepodds/longshot-live/KILL file. Emergency stop at any time:
  # `touch /opt/deepodds/longshot-live/KILL`.
  longshot-live:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot-live
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_MODE=live
      - LONGSHOT_DRY_RUN=false         # ARMED (canary, 2026-06-24) — real 1-ct orders; kill: touch /opt/deepodds/longshot-live/KILL
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_KILL_FILE=/data/KILL
      # FILL-AT-SIZE + CONCENTRATION TEST. 07-04: TRADE_FRACTION 0.005->0.02 proved fills
      # clean at 2-4 ct (0.000c slip, 100%). But 2-4 ct did NOT lift live's edge toward the
      # PAPER-forward +1.85c: paper earns it by CONCENTRATING ~20 ct/position into fat-
      # premium (8-12c) deep markets; $250 at 2-4 ct can't concentrate that way. 07-07:
      # TRADE_FRACTION 0.02->0.04 (~9 ct on ~$223 bal, depth-capped) to test whether
      # concentration closes the gap AND stress fills past 4 ct. MAX_PER_TRADE 10, $200
      # deployed + $25 daily kill UNCHANGED (worst single loss ~$8). If live c/ct climbs
      # toward paper's +1.85c => edge is capital-gated (fund $2-8k, fills now proven);
      # if it stays ~0 => edge isn't capturable at small scale.
      - LONGSHOT_ACCOUNT=250
      - LONGSHOT_TRADE_FRACTION=0.04
      - LONGSHOT_MAX_DEPLOYED=200
      - LONGSHOT_MAX_PER_TRADE=10
      - LONGSHOT_MAX_OPEN=120
      - LONGSHOT_MAX_DAILY_LOSS=25
    volumes:
      - /opt/deepodds/longshot-live:/data:z

  # Deribit-oracle capture daemon (GO-A data foundation, 2026-07-08). Read-only:
  # snapshots KXBTCD/KXETHD tails + Deribit-fair each hour and backfills settlement
  # -> the unbiased forward dataset that proves the +1.18c tail edge holds through
  # resolution. Places NO orders. Own volume; uses the shared Kalshi key in .env.
  oracle:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-oracle
    command: python -m vrp.oracle_daemon --loop --interval 3600 --out /data
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    volumes:
      - /opt/deepodds/oracle:/data:z

  # Kalshi order-book recorder (2026-07-08) — free MM optionality. Kalshi MM is
  # un-backtestable (no public historical book), so we start capturing now: depth
  # snapshots of the top-OI markets every 5 min -> dated JSONL. COARSE v1 (REST);
  # a websocket tick recorder is the follow-up for adverse-selection analysis.
  # Read-only, places NO orders.
  bookrec:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-bookrec
    command: python -m vrp.kalshi_book_recorder --loop --interval 300 --out /data
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    volumes:
      - /opt/deepodds/bookrec:/data:z

  frontend:
    image: "NGINX_IMAGE_PLACEHOLDER"
    container_name: deepodds-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
