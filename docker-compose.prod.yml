services:
  api:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-api
    command: uvicorn app.main:app --host 127.0.0.1 --port 8003 --proxy-headers --forwarded-allow-ips=*
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      # Read-only access to the longshot harness state for GET /api/v1/longshot/status.
      - LONGSHOT_STATE=/longshot-data/state.json
      - LONGSHOT_HISTORY=/longshot-data/history.jsonl
      - LONGSHOT_HEARTBEAT=/longshot-data/heartbeat.json
      # Read-only access to the LIVE harness state for GET /api/v1/longshot/live/status.
      - LONGSHOT_LIVE_STATE=/longshot-live-data/state.json
      - LONGSHOT_LIVE_HISTORY=/longshot-live-data/history.jsonl
      - LONGSHOT_LIVE_HEARTBEAT=/longshot-live-data/heartbeat.json
      # Read-only access to the Edge Explorer digest/ledger for GET /api/v1/explorer/*.
      - EXPLORER_DIR=/explorer-data
    volumes:
      - /opt/deepodds/longshot:/longshot-data:ro
      - /opt/deepodds/longshot-live:/longshot-live-data:ro
      - /opt/deepodds/explorer:/explorer-data:ro

  # Longshot-short paper harness (sell overpriced 1-12c Kalshi longshots near
  # settlement, vs the live order book). Self-contained: state persists in a
  # host bind-mount so the deploy's prune --volumes never wipes it.
  longshot:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_MAX_OPEN=120         # match live so the paper control is apples-to-apples
    volumes:
      - /opt/deepodds/longshot:/data:z

  # RETIRED 2026-08-04: OI-filter A/B paper arm (deepodds-longshot-paper-oi). The
  # question is ANSWERED — and the answer is "no difference". Day-clustered bootstrap
  # over the LIVE book (the only sample with real losses): hi-OI +0.72 c/ct vs lo-OI
  # +0.73 c/ct, CIs almost perfectly overlapping. The original #209 "low-OI is better"
  # signal was a cheap-selection artifact (VERDICT_BACKTEST_BIAS.md); the 2026-07-04
  # flip to HIGH-OI was chased on a small-n live read (YES 1.3% vs 4.7%) that has since
  # washed out entirely. Nothing here to promote to live, so this arm was only burning a
  # container on a 916MB box that has already thrashed itself dark once with this many
  # services running. Host state left at /opt/deepodds/longshot-paper-oi for reference.
  # Do NOT resurrect without a NEW hypothesis — re-running the same A/B just re-answers
  # the same question.

  # RETIRED 2026-07-09: sports-tails paper arm. The in-season series (game moneylines:
  # KXMLBGAME/KXWNBAGAME/KX*MATCH) have NO 1-12c tails — they price 20-70c (one ~coin-
  # flip contract/game), so there was nothing to sell (0 trades). The real sports TAILS
  # are football props (NFL first-TD/spread, NCAA) which are off-season now AND already
  # in the main longshot whitelist. No separate arm needed; revive via the main harness
  # in September. (Container torn down by the deploy's stop/rm; not restarted.)

  # Crypto-tails paper arm (GO-A, 2026-07-08) — the most promising new vein. Sells
  # 1-12c upper tails of Kalshi daily BTC/ETH markets, but ONLY when Kalshi overprices
  # them vs Deribit's risk-neutral fair (oracle gate) — "rent the sharper venue's
  # price". Correlation-capped per underlying (all BTC tails are one trade). Pure
  # paper. Snapshot edge was +1.18c/ct vs Deribit; this forward-validates it through
  # settlement alongside the oracle daemon's dataset.
  longshot-paper-crypto:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot-paper-crypto
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_MAX_OPEN=120
      - LONGSHOT_WHITELIST=KXBTCD,KXETHD
      - LONGSHOT_ORACLE_GATE=true          # sell only tails Kalshi overprices vs Deribit
      - LONGSHOT_ORACLE_MIN_EDGE=0.005      # require >= 0.5c Kalshi-over-Deribit gap
      - LONGSHOT_ORACLE_MIN_OTM=0.04        # REFINED 07-10: only tails >=4% OTM (exclude near-money poison)
      - LONGSHOT_MAX_UNDERLYING=150         # REFINED 07-10: 400->150, tighter correlation cap (~2% of sim $8k)
    volumes:
      - /opt/deepodds/longshot-paper-crypto:/data:z

  # Longshot-short LIVE harness (real Kalshi orders). Same signal as the paper
  # container above, which keeps running untouched as the control. Ships SAFE:
  # LONGSHOT_DRY_RUN=true => it reconciles + reads Kalshi truth + logs INTENDED
  # orders but places NOTHING (Phase 1/2). To arm (Phase 3): fund the account,
  # load a trading-scoped key into .env, set LONGSHOT_DRY_RUN=false, ensure no
  # /opt/deepodds/longshot-live/KILL file. Emergency stop at any time:
  # `touch /opt/deepodds/longshot-live/KILL`.
  longshot-live:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-longshot-live
    command: python -m longshot.loop --interval 3600
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - LONGSHOT_MODE=live
      - LONGSHOT_DRY_RUN=false         # ARMED (canary, 2026-06-24) — real 1-ct orders; kill: touch /opt/deepodds/longshot-live/KILL
      - LONGSHOT_STATE=/data/state.json
      - LONGSHOT_HISTORY=/data/history.jsonl
      - LONGSHOT_HEARTBEAT=/data/heartbeat.json
      - LONGSHOT_KILL_FILE=/data/KILL
      # SCALED FOR $250 DEPOSIT (2026-08-04): account ~$275 -> ~$520.
      #
      # MAX_PER_TRADE 10 -> 25 is REQUIRED, not optional: replaying the sizing rule over
      # 1069 real entries, acct=$520 with the cap at 10 is BYTE-IDENTICAL to acct=$275
      # (188 cts/day, $180 collat/day). The deposit does literally nothing until it moves.
      # 25 is the natural value — it is the smallest cap that never binds (0% of entries
      # clipped), and 40 or uncapped give IDENTICAL output because the 0.25*bid depth
      # limit takes over. So 25 buys full capacity with zero extra tail risk.
      #   at 25: 348 cts/day, $334 collat/day, avg clip 13.4, p95 clip 22.
      #
      # This IS the #227 change (10->25) that #228 reverted. That revert was WRONG:
      # it rested on 07-11..07-13, n=65, day-clustered CI [-7.64,+3.24] c/ct — no
      # information — while ALL 13 clip>=11 trades in live history settled PROFITABLE
      # (13/13), and a worse day (-$16, 07-25) later landed at the REVERTED small size.
      #
      # STILL THE UNTESTED AXIS: largest clip ever actually filled live is 15; p95 goes
      # to 22 here. WATCH fill_rate (99.86%) and avg_slippage_c (-0.039) after this — they
      # are the only honest read on whether the book supports bigger clips. Paper cannot
      # answer it: paper fills the whole clip at the quoted bid and models no book walk.
      # See project_kalshi_longshot memory for the depth-measured capacity curve.
      #
      # LONGSHOT_ACCOUNT is VESTIGIAL for live as of #234 — live sizes off real Kalshi
      # equity (balance + deployed) read fresh each tick. Paper still uses its own value.
      - LONGSHOT_ACCOUNT=250
      - LONGSHOT_TRADE_FRACTION=0.04
      - LONGSHOT_MAX_DEPLOYED=400
      - LONGSHOT_MAX_PER_TRADE=25
      - LONGSHOT_MAX_OPEN=120
      # Circuit breaker, NOT a risk budget: breaching it trips the kill sentinel and
      # halts ALL new orders until /opt/deepodds/longshot-live/KILL is deleted by hand.
      # Held at ~25% of expected daily deployed collateral. History: 25 (at ~$94/day) ->
      # 50 (2026-08-04, when #233/#234 doubled deployment to ~$180/day) -> 85 (same day,
      # for the $250 deposit taking expected deployment to ~$334/day). Worst day in 41
      # days was -$16 at ~$94 deployed = -17% of deployed, so 25% clears a normal bad day
      # and still catches an anomaly. ALWAYS rescale this WITH a capital change.
      - LONGSHOT_MAX_DAILY_LOSS=85
    volumes:
      - /opt/deepodds/longshot-live:/data:z

  # Deribit-oracle capture daemon (GO-A data foundation, 2026-07-08). Read-only:
  # snapshots KXBTCD/KXETHD tails + Deribit-fair each hour and backfills settlement
  # -> the unbiased forward dataset that proves the +1.18c tail edge holds through
  # resolution. Places NO orders. Own volume; uses the shared Kalshi key in .env.
  oracle:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-oracle
    command: python -m vrp.oracle_daemon --loop --interval 3600 --out /data
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    volumes:
      - /opt/deepodds/oracle:/data:z

  # Kalshi order-book recorder (2026-07-08) — free MM optionality. Kalshi MM is
  # un-backtestable (no public historical book), so we start capturing now: depth
  # snapshots of the top-OI markets every 5 min -> dated JSONL. COARSE v1 (REST);
  # a websocket tick recorder is the follow-up for adverse-selection analysis.
  # Read-only, places NO orders.
  bookrec:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-bookrec
    command: python -m vrp.kalshi_book_recorder --loop --interval 300 --out /data
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    volumes:
      - /opt/deepodds/bookrec:/data:z

  # Edge Explorer daemon (2026-07-15) — a daily curiosity engine with a memory. Reads
  # the data we already bank (oracle settlement record, longshot harness history, Deribit
  # chain) and writes a ranked list of OBSERVATIONS worth investigating (never trade
  # signals) to observations.jsonl + digest_*.json. Flags each metric vs its OWN trailing
  # baseline, ranks by surprise x persistence, and surfaces broken sources (e.g. bookrec)
  # as data-quality observations. Pure file I/O: mounts the source dirs read-only, writes
  # its own :z volume. Places NO orders, touches no venue.
  explorer:
    image: "IMAGE_PLACEHOLDER"
    container_name: deepodds-explorer
    command: python -m explorer.daemon --loop --interval 86400 --out /data
    restart: unless-stopped
    network_mode: host
    env_file: /opt/deepodds/.env
    environment:
      - EXPLORER_ORACLE_DIR=/oracle-data
      - EXPLORER_LONGSHOT_PAPER_DIR=/longshot-data
      - EXPLORER_LONGSHOT_LIVE_DIR=/longshot-live-data
      - EXPLORER_DERIBIT_DIR=/vrp-data
      - EXPLORER_BOOKREC_DIR=/bookrec-data
    volumes:
      - /opt/deepodds/explorer:/data:z
      - /opt/deepodds/oracle:/oracle-data:ro
      - /opt/deepodds/longshot:/longshot-data:ro
      - /opt/deepodds/longshot-live:/longshot-live-data:ro
      - /opt/deepodds/vrp-data:/vrp-data:ro
      - /opt/deepodds/bookrec:/bookrec-data:ro

  frontend:
    image: "NGINX_IMAGE_PLACEHOLDER"
    container_name: deepodds-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
