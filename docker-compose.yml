services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepodds
      POSTGRES_PASSWORD: deepodds
      POSTGRES_DB: deepodds
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepodds"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
