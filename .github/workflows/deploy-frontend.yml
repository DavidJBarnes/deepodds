name: Deploy · Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_NGINX: deepodds-nginx
  CONTAINER_NGINX: deepodds-nginx
  FRONTEND_PORT: "8084"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React app (native, no QEMU)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend (arm64)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f frontend/Dockerfile.prod \
            -t $ECR_REGISTRY/$ECR_NGINX:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_NGINX:latest \
            --push \
            .

      - name: Deploy frontend via SSM
        id: ssm
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_NGINX:$IMAGE_TAG"
          COMPOSE_FILE="/opt/deepodds/docker-compose.yml"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters commands='[
              "set -e",
              "COMPOSE_FILE='"$COMPOSE_FILE"'",
              "echo === Ensuring docker compose is available ===",
              "docker compose version &>/dev/null || (mkdir -p /usr/local/lib/docker/cli-plugins && ARCH=$(uname -m); if [ \"$ARCH\" = \"aarch64\" ]; then COMPOSE_ARCH=aarch64; else COMPOSE_ARCH=x86_64; fi; curl -SL https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-${COMPOSE_ARCH} -o /usr/local/lib/docker/cli-plugins/docker-compose && chmod +x /usr/local/lib/docker/cli-plugins/docker-compose && echo compose installed)",
              "echo === Logging into ECR ===",
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              "echo === Saving current image for rollback ===",
              "ROLLBACK_IMAGE=$(docker inspect --format='"'{{.Config.Image}}'"' '"$CONTAINER_NGINX"' 2>/dev/null || echo '"''"')",
              "echo rollback image: $ROLLBACK_IMAGE",
              "echo === Pulling new image ===",
              "docker pull '"$IMAGE"'",
              "echo === Updating compose file ===",
              "if [ ! -f $COMPOSE_FILE ]; then echo ERROR: $COMPOSE_FILE not found -- run backend deploy first; exit 2; fi",
              "sed -i \"/^  frontend:$/,/^  [a-z]/{s|^    image:.*|    image: \\\"'"$IMAGE"'\\\"|;}\" $COMPOSE_FILE",
              "grep -q \"$IMAGE\" $COMPOSE_FILE || { echo ERROR: compose file update failed; exit 3; }",
              "echo === Redeploying frontend ===",
              "docker stop '"$CONTAINER_NGINX"' 2>/dev/null || true",
              "docker rm '"$CONTAINER_NGINX"' 2>/dev/null || true",
              "docker compose -f $COMPOSE_FILE up -d frontend",
              "echo === Health-checking ===",
              "for i in 1 2 3 4 5 6; do curl -sf http://127.0.0.1:'"$FRONTEND_PORT"'/ && echo Health OK && break; echo Attempt $i, waiting 5s...; sleep 5; done",
              "if curl -sf http://127.0.0.1:'"$FRONTEND_PORT"'/; then",
              "  echo === Deploy successful, pruning dangling images ===",
              "  docker image prune -f 2>/dev/null || true",
              "else",
              "  echo === FAILED: rolling back ===",
              "  if [ -n \"$ROLLBACK_IMAGE\" ] && [ -f $COMPOSE_FILE ]; then",
              "    sed -i \"/^  frontend:$/,/^  [a-z]/{s|^    image:.*|    image: \\\"$ROLLBACK_IMAGE\\\"|;}\" $COMPOSE_FILE",
              "    docker stop '"$CONTAINER_NGINX"' 2>/dev/null || true",
              "    docker rm '"$CONTAINER_NGINX"' 2>/dev/null || true",
              "    docker compose -f $COMPOSE_FILE up -d frontend",
              "    echo === Rollback complete ===",
              "  else",
              "    echo No previous image or compose file to roll back to",
              "    docker compose -f $COMPOSE_FILE down frontend 2>/dev/null || true",
              "  fi",
              "  exit 1",
              "fi",
               "echo === Ensuring host nginx gateway is running ===",
              "if ! command -v nginx &>/dev/null; then apt-get update -qq && apt-get install -y -qq nginx; echo nginx installed; fi",
              "if ! systemctl is-active --quiet nginx; then systemctl start nginx && echo nginx started; fi",
              "systemctl enable nginx 2>/dev/null && echo nginx enabled on boot || true",
              "echo === Deploy complete ==="
            ]' \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for frontend deployment
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          echo "SSM CommandId: $COMMAND_ID"
          echo "View in AWS Console: https://${AWS_REGION}.console.aws.amazon.com/systems-manager/run-command/${COMMAND_ID}"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query 'StandardOutputContent' --output text
                exit 0 ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut|ExecutionTimedOut|AccessDenied|InvalidPlatform|Undeliverable|Terminated)
                echo "--- STATUS: $STATUS ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --query '{StatusDetails:StatusDetails, ResponseCode:ResponseCode, ExecutionStartDateTime:ExecutionStartDateTime, ExecutionEndDateTime:ExecutionEndDateTime}' \
                  --output table
                echo "--- STDOUT (last 24KB only — full output in AWS Console) ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query 'StandardOutputContent' --output text
                echo "--- STDERR ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query 'StandardErrorContent' --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out waiting for SSM command"; exit 1

      - name: Deploy nginx gateway config
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "=== Encoding nginx gateway config ==="
          NGINX_CONF_B64=$(base64 -w0 nginx/nginx-gateway.conf)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 60 \
            --parameters commands='[
              "set -e",
              "NGINX_CONF_B64='"$NGINX_CONF_B64"'",
              "echo === Removing default nginx server blocks ===",
              "if [ -f /etc/nginx/conf.d/default.conf ]; then mv /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/default.conf.bak 2>/dev/null; echo default.conf disabled; fi",
              "rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true",
              "echo === Writing deepodds nginx config ===",
              "echo $NGINX_CONF_B64 | base64 -d > /etc/nginx/conf.d/deepodds.conf",
              "echo === Ensuring letsencrypt webroot ===",
              "mkdir -p /var/www/letsencrypt",
              "echo === Testing nginx config ===",
              "nginx -t",
              "echo === Reloading nginx ===",
              "systemctl reload nginx",
              "echo === Verifying port 443 ===",
              "ss -tlnp 2>/dev/null | grep :443 || netstat -tlnp 2>/dev/null | grep :443 || echo WARNING: nginx not listening on 443",
              "echo === nginx gateway deployed ==="
            ]' \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM nginx config command: $COMMAND_ID"
          for i in $(seq 1 12); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "--- NGINX DEPLOY OUTPUT ---"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query 'StandardOutputContent' --output text; exit 0 ;;
              Failed|TimedOut|Cancelled) echo "--- NGINX DEPLOY STDERR ---"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query 'StandardErrorContent' --output text; exit 1 ;;
              *) echo "  nginx deploy: $STATUS..." ;;
            esac
          done
          echo "Nginx deploy timed out"; exit 1

      - name: Diagnostic — check external reachability
        if: always()
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "=== EC2 public IP ==="
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text 2>/dev/null || echo "NO_PUBLIC_IP")
          echo "Public IP: $PUBLIC_IP"
          echo "=== DNS resolution ==="
          DOMAIN="deepodds.davidjbarnes.com"
          RESOLVED=$(dig +short "$DOMAIN" 2>/dev/null || nslookup "$DOMAIN" 2>/dev/null | grep -A1 Name | tail -1 | awk '{print $2}' || echo "DNS_FAIL")
          echo "DNS resolves $DOMAIN to: $RESOLVED"
          echo "=== EC2 instance diagnostics via SSM ==="
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 30 \
            --parameters commands='[
              "echo === nginx status ===",
              "systemctl is-active nginx 2>/dev/null || echo NOT ACTIVE",
              "echo === nginx config test ===",
              "nginx -t 2>&1 || true",
              "echo === nginx listening ports ===",
              "ss -tlnp 2>/dev/null | grep nginx || netstat -tlnp 2>/dev/null | grep nginx || echo no nginx listeners",
              "echo === nginx sites-enabled ===",
              "ls -la /etc/nginx/sites-enabled/ 2>/dev/null || echo no sites-enabled dir",
              "echo === nginx default config ===",
              "cat /etc/nginx/sites-enabled/default 2>/dev/null || cat /etc/nginx/conf.d/default.conf 2>/dev/null || echo no default config",
              "echo === nginx deepodds config ===",
              "cat /etc/nginx/sites-enabled/deepodds 2>/dev/null || echo no deepodds site config",
              "echo === letsencrypt certs ===",
              "ls -la /etc/letsencrypt/live/ 2>/dev/null || echo no letsencrypt live dir",
              "echo === iptables rules ===",
              "iptables -L INPUT -n 2>/dev/null | head -20 || echo iptables not accessible",
              "echo === test localhost:80 ===",
              "curl -sI --max-time 3 http://127.0.0.1/ 2>&1 || echo localhost:80 failed",
              "echo === test localhost:443 ===",
              "curl -skI --max-time 3 https://127.0.0.1/ 2>&1 || echo localhost:443 failed",
              "echo === test external domain ===",
              "curl -sI --max-time 5 https://deepodds.davidjbarnes.com/ 2>&1 || echo external curl failed",
              "echo === instance public IP ===",
              "curl -s --max-time 3 http://checkip.amazonaws.com 2>/dev/null || echo no public IP",
              "echo === frontend container ===",
              "docker ps --filter name=deepodds-nginx 2>/dev/null || echo no container"
            ]' \
            --query 'Command.CommandId' \
            --output text > /tmp/ssm_diag_cmd.txt
          CMD_ID=$(cat /tmp/ssm_diag_cmd.txt)
          echo "SSM diagnostic command: $CMD_ID"
          echo "Waiting for result..."
          for i in $(seq 1 12); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "--- DIAGNOSTIC OUTPUT ---"; aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query 'StandardOutputContent' --output text; exit 0 ;;
              Failed|TimedOut|Cancelled) echo "--- DIAGNOSTIC STDERR ---"; aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query 'StandardErrorContent' --output text; exit 0 ;;
              *) echo "  diagnostic: $STATUS..." ;;
            esac
          done
          echo "Diagnostic timed out"
