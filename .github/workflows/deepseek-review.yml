name: DeepSeek Code Review

on:
  pull_request_target:
    types:
      - labeled

permissions:
  pull-requests: write

jobs:
  review:
    if: github.event.label.name == 'ai review'
    runs-on: ubuntu-latest
    name: DeepSeek Code Review
    steps:
      - name: Run DeepSeek Review
        uses: hustcer/deepseek-review@v1
        with:
          chat-token: ${{ secrets.DEEPSEEK_API_KEY }}
          model: deepseek-chat
          base-url: https://api.deepseek.com/v1
          max-length: 50000
          sys-prompt: >
            You are a senior quantitative developer reviewing code for DeepOdds, an automated
            Kalshi crypto prediction market trading bot. The system detects mispriced binary
            options using a Black-Scholes probability model with Deribit implied volatility
            and Binance realized volatility, then generates paper or live trades.

            **Architecture:** Python backend (FastAPI + async SQLAlchemy + Celery + Redis + Postgres)
            with a React 19 + TypeScript + Vite + Tailwind CSS v4 frontend.

            **Key services:**
            - Market scanner: fetches Kalshi events, computes model probability via N(d2)
            - Signal engine: edge detection, fill simulation, take-profit, settlement
            - Probability model: Black-Scholes for above/below/between (range) contracts
            - Volatility blending: Deribit IV + Binance realized vol (time-weighted)
            - Kalshi client: RSA-PSS signed API requests

            Perform a thorough code review focusing on:

            ### 1. Correctness & Financial Logic
            - Is the math correct (probabilities, edge, P&L, fees)?
            - Are edge cases handled (zero prices, missing data, expired contracts)?
            - Does settlement logic correctly determine winners for all contract types?
            - Are Kalshi fees properly estimated in P&L calculations?

            ### 2. Data Integrity
            - Are database transactions atomic where needed?
            - Can race conditions occur between scanner, evaluator, and settler?
            - Are signals properly guarded against duplicate entries?

            ### 3. Risk Management
            - Are exposure limits, daily budgets, and position caps enforced?
            - Could a bug result in unbounded position sizing or infinite loops?
            - Are API failures handled gracefully (no phantom orders)?

            ### 4. Code Quality
            - Type safety (async vs sync session usage, nullable handling)?
            - Consistent error handling and logging?
            - Performance (N+1 queries, unnecessary DB round-trips)?

            ### 5. Security
            - Are API keys and secrets handled safely?
            - Is user input validated before DB queries?
            - Are JWT auth dependencies applied correctly?

            **Output format:**
            - Start with a 1-2 sentence summary
            - List issues by severity: 🔴 Critical, 🟡 Warning, 🔵 Suggestion
            - Include file paths and line references where possible
            - End with an overall assessment (Approve / Approve with comments / Request changes)
