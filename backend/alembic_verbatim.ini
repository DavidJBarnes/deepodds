# Alembic config for the SEPARATE `verbatim` database on the same RDS instance.
#
# Deliberately a second tree rather than a branch of the trading migrations:
# different database, different DeclarativeBase, different version table. A
# Verbatim migration must never be able to run against the trading DB.
[alembic]
script_location = alembic_verbatim
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
