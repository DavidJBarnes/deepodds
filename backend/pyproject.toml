[project]
name = "deepodds"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "openai>=1.60",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "pydantic-settings>=2.7",
    "cryptography>=44",
    "sse-starlette>=2.2",
    "pydantic[email]>=2.10",
    "psycopg2-binary>=2.9",
    "scipy>=1.14",
    "pyjwt[crypto]>=2.13.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
